import com.google.protobuf.gradle.*
import groovy.json.JsonSlurper
import java.util.Locale

plugins {
    id "com.google.protobuf" version "0.9.4"
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def defaultKeyPropertiesFile = new File(System.getProperty('user.home'), '.sealdesk/key.properties')
def keyPropertiesPath = System.getenv('SEALDESK_KEY_PROPERTIES')
        ?: defaultKeyPropertiesFile.absolutePath
def keystorePropertiesFile = file(keyPropertiesPath)
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def requiredKeystoreProperties = ['keyAlias', 'keyPassword', 'storeFile', 'storePassword']
def missingKeystoreProperties = requiredKeystoreProperties.findAll {
    !keystoreProperties.getProperty(it)?.trim()
}
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains('release')
}
if (releaseTaskRequested && (!keystorePropertiesFile.isFile() || !missingKeystoreProperties.isEmpty())) {
    def missing = !keystorePropertiesFile.isFile()
            ? "properties file ${keystorePropertiesFile.absolutePath}"
            : "properties: ${missingKeystoreProperties.join(', ')}"
    throw new GradleException("Release signing is not configured; provide ${missing} outside the repository")
}
if (!missingKeystoreProperties.isEmpty()) {
    logger.lifecycle("Android release signing is not configured; release tasks will fail until ${keystorePropertiesFile.absolutePath} is populated")
}
def releaseKeystoreFile = keystoreProperties.getProperty('storeFile')
        ? file(keystoreProperties.getProperty('storeFile'))
        : null
if (releaseTaskRequested && releaseKeystoreFile != null && !releaseKeystoreFile.isFile()) {
    throw new GradleException("Android release keystore does not exist: ${releaseKeystoreFile.absolutePath}")
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Add rustls-platform-verifier Android support
String findRustlsPlatformVerifierMavenDir() {
    def dependencyText = providers.exec {
        it.workingDir = new File("../..")
        commandLine("cargo", "metadata", "--format-version", "1")
    }.standardOutput.asText.get()

    def dependencyJson = new JsonSlurper().parseText(dependencyText)
    def pkg = dependencyJson.packages.find { it.name == "rustls-platform-verifier-android" }
    
    if (pkg == null) {
        throw new GradleException("rustls-platform-verifier-android package not found in cargo metadata!")
    }
    
    def manifestPath = file(pkg.manifest_path)
    def mavenDir = new File(manifestPath.parentFile, "maven")
    
    if (!mavenDir.exists()) {
        throw new GradleException("Maven directory not found at: ${mavenDir.path}")
    }
    
    println("✓ Found rustls-platform-verifier maven repo at: ${mavenDir.path}")
    return mavenDir.path
}


repositories {
    maven {
        url = findRustlsPlatformVerifierMavenDir()
        metadataSources.artifact()
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.20.1'
    }

    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java {
                    option "lite"
                }
            }
        }
    }
}

android {
    namespace "com.runseal.sealdesk"
    compileSdkVersion 36
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'

        main.proto.srcDirs += '../../../libs/base/protos'
        main.proto.includes += "message.proto"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.runseal.sealdesk"
        minSdkVersion 22
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
      release {
        keyAlias keystoreProperties['keyAlias']
        keyPassword keystoreProperties['keyPassword']
        storeFile releaseKeystoreFile
        storePassword keystoreProperties['storePassword']
      }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules'
        }
    }
}

// Flutter's split-per-ABI helper prefixes the ABI id onto versionCode. SealDesk
// intentionally uses one stable release code across ABI outputs.
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        output.versionCodeOverride = flutterVersionCode.toInteger()
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'com.google.protobuf:protobuf-javalite:3.20.1'
    implementation "androidx.media:media:1.6.0"
    implementation 'com.github.getActivity:XXPermissions:18.5'
    implementation("org.jetbrains.kotlin:kotlin-stdlib") { version { strictly("1.9.10") } }
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation "rustls:rustls-platform-verifier:0.1.1"
}
