name: Debug Windows packaging

# Re-runs only the Windows packaging steps of flutter-build.yml against the unsigned
# build an earlier run uploaded, so packaging fixes can be checked in minutes instead
# of a full tag build. Keep the steps in sync with build-for-windows-flutter.

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: "Run that uploaded sealdesk-unsigned-windows-<arch>"
        required: true
      arch:
        type: choice
        options: [x86_64, aarch64]
        default: x86_64
      version:
        description: "Version used in output file names"
        default: "0.0.0-debug"

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ${{ inputs.arch == 'aarch64' && 'windows-11-arm' || 'windows-2022' }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download unsigned build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealdesk-unsigned-windows-${{ inputs.arch }}
          path: ./rustdesk
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/SealDesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/sealdesk-${{ env.VERSION }}-${{ inputs.arch }}.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: ${{ inputs.arch == 'aarch64' && 'arm64' || 'x86' }}

      - name: Build msi
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk
          nuget restore msi.sln
          $msiPlatform = if ('${{ inputs.arch }}' -eq 'aarch64') { 'ARM64' } else { 'x64' }
          msbuild msi.sln -p:Configuration=Release -p:Platform=$msiPlatform /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../SignOutput/sealdesk-${{ env.VERSION }}-${{ inputs.arch }}.msi
          sha256sum ../../SignOutput/sealdesk-*.msi

      - name: Build pre-built MSI template
        run: |
          git checkout -- res/msi
          cp -r ./rustdesk ./rustdesk-msi-template
          mv ./rustdesk-msi-template/SealDesk.exe ./rustdesk-msi-template/RDAPPNAM.exe
          Set-Content -Path ./rustdesk-msi-template/custom.txt -Value 'placeholder' -NoNewline
          $assets = './rustdesk-msi-template/data/flutter_assets/assets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          foreach ($a in 'icon.ico','icon.png','logo.png','logo_light.png','logo_dark.png') {
            Set-Content -Path "$assets/$a" -Value 'placeholder' -NoNewline
          }
          pushd ./res/msi
          python preprocess.py --arp --template --revision-version 0 -d ../../rustdesk-msi-template --app-name RDAPPNAM
          $msiPlatform = if ('${{ inputs.arch }}' -eq 'aarch64') { 'ARM64' } else { 'x64' }
          msbuild msi.sln -t:clean -p:Configuration=Release -p:Platform=$msiPlatform
          msbuild msi.sln -p:Configuration=Release -p:Platform=$msiPlatform /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          popd
          mkdir ./msi-template
          mv $msi.FullName ./msi-template/rustdesk-template-${{ inputs.arch }}.msi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-windows-${{ inputs.arch }}
          path: |
            ./SignOutput
            ./msi-template
