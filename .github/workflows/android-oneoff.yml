name: One-off Android build
on:
  workflow_dispatch:
  push:
    branches: [fix/android-release-signing]
jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      publish-release: false
      publish-update-metadata: false
      platforms: android
