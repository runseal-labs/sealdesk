name: Full Flutter CI

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated subset of windows,macos,android,linux, or all"
        default: "all"
  pull_request:
    paths-ignore:
    - "docs/**"
    - "**/*.md"
    - "res/design.svg"
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
      - "res/design.svg"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

jobs:
  run-ci:
    # flutter-build.yml declares contents: write on its SBOM and update-metadata
    # jobs; a caller must grant at least that or the workflow fails validation.
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
      platforms: ${{ inputs.platforms || 'all' }}
