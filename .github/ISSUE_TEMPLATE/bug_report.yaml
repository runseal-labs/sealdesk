name: 🐞 Bug report
description: Report a SealDesk bug in English or Chinese; redact credentials and QR codes.
labels: ["bug"]
body:
  - type: textarea
    id: desc
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is (if it's a keyboard issue, provide the keyboard mode you're using. e.g. legacy, map, translate)
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to Reproduce
      description: What steps can we take to reproduce this behavior?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system(s) on local (controlling) side and remote (controlled) side
      description: What operating system(s) do you see this bug on? local (controlling) side -> remote (controlled) side.
      placeholder: |
        Windows 10 -> osx
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SealDesk / RustDesk Version(s) on local (controlling) side and remote (controlled) side
      description: What SealDesk / RustDesk version(s) do you see this bug on? local (controlling) side -> remote (controlled) side.
      placeholder: |
        SealDesk 0.1.0-alpha.1 -> RustDesk 1.4.9
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Hide pairing codes, tc addresses, passwords, and personal data before attaching screenshots or video.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any additonal context about the problem here
